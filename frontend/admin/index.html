<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ Панель - IndPro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        button {
            padding: 5px 10px;
            margin: 2px;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            background-color: #f0f0f0;
        }
        button:hover {
            background-color: #e0e0e0;
        }
        .delete-btn {
            background-color: #ffcccc;
        }
        .delete-btn:hover {
            background-color: #ff9999;
        }
        a {
            display: inline-block;
            margin-top: 15px;
            color: #0066cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .error {
            color: red;
            font-size: 14px;
        }
        .success {
            color: green;
            font-size: 14px;
        }
    </style>
</head>
<body>

<h1>Админ Панель</h1>

<table id="bidsTable">
    <thead>
        <tr>
            <th>Заголовок</th>
            <th>Автор</th>
            <th>Статус</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        <!-- Заявления будут добавлены сюда -->
    </tbody>
</table>

<div id="message"></div>

<a href="../bid/index.html">Подать заявление</a> | 
<a href="../login/index.html">Выход</a>

<script>
    const apiUrl = 'http://localhost:8000';
    
    async function loadBids() {
        const token = localStorage.getItem('token');
        if (!token) {
            alert('Сначала авторизуйтесь!');
            window.location.href = '../login/index.html';
            return;
        }
        
        try {
            const response = await fetch(`${apiUrl}/api/bids/getall`, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            
            const data = await response.json();
            
            if (response.ok && data.code === 200) {
                const tbody = document.querySelector('#bidsTable tbody');
                tbody.innerHTML = '';
                
                data.bids.forEach(bid => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><a href="../bid-view/index.html?id=${bid.id}">${bid.name}</a></td>
                        <td>${bid.owner_username}</td>
                        <td>
                            <select onchange="changeStatus('${bid.id}', this.value)">
                                <option value="${bid.status}">${bid.status}</option>
                                <option value="new">new</option>
                                <option value="in_progress">in_progress</option>
                                <option value="completed">completed</option>
                                <option value="rejected">rejected</option>
                            </select>
                        </td>
                        <td>
                            <button onclick="viewBid('${bid.id}')">Просмотр</button>
                            <button class="delete-btn" onclick="deleteBid('${bid.id}')">Удалить</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } else {
                document.getElementById('message').innerHTML = `<p class="error">Ошибка загрузки: ${data.detail || 'Неизвестная ошибка'}</p>`;
            }
        } catch (error) {
            console.error('Ошибка:', error);
            document.getElementById('message').innerHTML = '<p class="error">Ошибка сети</p>';
        }
    }
    
    function viewBid(bidId) {
        window.location.href = `../bid-view/index.html?id=${bidId}`;
    }
    
    async function changeStatus(bidId, newStatus) {
        const token = localStorage.getItem('token');
        const messageDiv = document.getElementById('message');
        
        try {
            const response = await fetch(`${apiUrl}/api/bids/changestat`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ id: bidId, status: newStatus })
            });
            
            const data = await response.json();
            
            if (response.ok && data.code === 200) {
                messageDiv.innerHTML = '<p class="success">Статус изменен</p>';
                setTimeout(() => { loadBids(); }, 1000);
            } else {
                messageDiv.innerHTML = `<p class="error">Ошибка: ${data.detail || 'Неизвестная ошибка'}</p>`;
            }
        } catch (error) {
            console.error('Ошибка:', error);
            messageDiv.innerHTML = '<p class="error">Ошибка сети</p>';
        }
    }
    
    async function deleteBid(bidId) {
        if (!confirm('Вы уверены?')) return;
        
        const token = localStorage.getItem('token');
        const messageDiv = document.getElementById('message');
        
        try {
            const response = await fetch(`${apiUrl}/api/bids/deleteone?id=${bidId}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            
            const data = await response.json();
            
            if (response.ok && data.code === 200) {
                messageDiv.innerHTML = '<p class="success">Заявление удалено</p>';
                setTimeout(() => { loadBids(); }, 1000);
            } else {
                messageDiv.innerHTML = `<p class="error">Ошибка: ${data.detail || 'Неизвестная ошибка'}</p>`;
            }
        } catch (error) {
            console.error('Ошибка:', error);
            messageDiv.innerHTML = '<p class="error">Ошибка сети</p>';
        }
    }
    
    loadBids();
</script>

</body>
</html>
