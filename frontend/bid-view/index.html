<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявление - IndPro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .bid-info {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .field {
            margin: 15px 0;
        }
        .label {
            font-weight: bold;
            color: #333;
        }
        .value {
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 4px;
            margin-top: 5px;
        }
        button {
            width: 100%;
            height: 45px;
            font-size: 16px;
            margin: 20px 0 10px 0;
            border: 2px solid #707070;
            border-radius: 8px;
            background-color: #f0f0f0;
            cursor: pointer;
        }
        button:hover {
            background-color: #e0e0e0;
        }
        .delete-btn {
            background-color: #ffcccc;
        }
        .delete-btn:hover {
            background-color: #ff9999;
        }
        .file-list {
            margin-top: 10px;
        }
        .file-item {
            padding: 8px;
            background-color: #e8e8e8;
            margin: 5px 0;
            border-radius: 4px;
        }
        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #0066cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .error {
            color: red;
            font-size: 14px;
        }
        .success {
            color: green;
            font-size: 14px;
        }
    </style>
</head>
<body>

<h1>Заявление</h1>

<div class="bid-info" id="bidInfo">
    <p>Загрузка...</p>
</div>

<div id="message"></div>

<a href="../admin/index.html">Вернуться</a>

<script>
    const apiUrl = 'http://localhost:8000';
    
    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }
    
    function base64ToBlob(base64, contentType) {
        const binaryString = atob(base64);
        const length = binaryString.length;
        const bytes = new Uint8Array(length);
        for (let i = 0; i < length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        return new Blob([bytes], { type: contentType });
    }

    function downloadBase64File(base64String, fileName, mimeType) {
        const blob = base64ToBlob(base64String, mimeType || 'application/octet-stream');
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    async function loadBid() {
        const bidId = getQueryParam('id');
        const token = localStorage.getItem('token');
        
        if (!bidId) {
            document.getElementById('bidInfo').innerHTML = '<p class="error">ID заявления не найден</p>';
            return;
        }
        
        if (!token) {
            alert('Сначала авторизуйтесь!');
            window.location.href = '../login/index.html';
            return;
        }
        
        try {
            const response = await fetch(`${apiUrl}/api/bids/getone?id=${bidId}`, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            
            const data = await response.json();
            
            if (response.ok && data.code === 200) {
                const bid = data.bid;
                let html = `
                    <div class="field">
                        <div class="label">Заголовок:</div>
                        <div class="value">${bid.name}</div>
                    </div>
                    <div class="field">
                        <div class="label">Автор:</div>
                        <div class="value">${bid.owner_fio} (${bid.owner_username})</div>
                    </div>
                    <div class="field">
                        <div class="label">Должность:</div>
                        <div class="value">${bid.owner_job}</div>
                    </div>
                    <div class="field">
                        <div class="label">Статус:</div>
                        <div class="value">${bid.status}</div>
                    </div>
                    <div class="field">
                        <div class="label">Дата:</div>
                        <div class="value">${bid.timestamp ? bid.timestamp.replace('T', ' ') : 'N/A'}</div>
                    </div>
                    <div class="field">
                        <div class="label">Основной текст:</div>
                        <div class="value">${bid.content}</div>
                    </div>
                `;
                
                if (bid.add_content) {
                    html += `
                        <div class="field">
                            <div class="label">Дополнительно:</div>
                            <div class="value">${bid.add_content}</div>
                        </div>
                    `;
                }
                
                if (bid.files_b64 && bid.files_b64.length > 0) {
                    html += `
                        <div class="field">
                            <div class="label">Файлы:</div>
                            <div class="file-list" id="fileList"></div>
                        </div>
                    `;
                }
                
                document.getElementById('bidInfo').innerHTML = html;

                if (bid.files_b64 && bid.files_b64.length > 0) {
                    const fileList = document.getElementById('fileList');
                    bid.files_b64.forEach((file, i) => {
                        const fileItem = document.createElement('div');
                        fileItem.className = 'file-item';
                        const originalName = Array.isArray(bid.files) && bid.files[i] ? bid.files[i] : null;
                        const fileName = originalName || (file && typeof file === 'object' ? (file.name || `file-${i + 1}`) : `file-${i + 1}`);
                        const fileMime = file && typeof file === 'object' ? (file.mime || 'application/octet-stream') : 'application/octet-stream';
                        const fileB64 = file && typeof file === 'object' ? file.b64 : file;
                        const downloadButton = document.createElement('button');
                        downloadButton.type = 'button';
                        downloadButton.textContent = `Скачать ${fileName}`;
                        downloadButton.addEventListener('click', () => {
                            downloadBase64File(fileB64, fileName, fileMime);
                        });
                        fileItem.appendChild(downloadButton);
                        fileList.appendChild(fileItem);
                    });
                }
            } else {
                document.getElementById('bidInfo').innerHTML = `<p class="error">Ошибка: ${data.detail || 'Неизвестная ошибка'}</p>`;
            }
        } catch (error) {
            console.error('Ошибка:', error);
            document.getElementById('bidInfo').innerHTML = '<p class="error">Ошибка сети</p>';
        }
    }
    
    loadBid();
</script>

</body>
</html>
