<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - IndPro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        input, textarea {
            width: 100%;
            height: 45px;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
            box-sizing: border-box;
            border: 2px solid #707070;
            border-radius: 8px;
        }
        textarea {
            height: auto;
            min-height: 50px;
        }
        button {
            width: 100%;
            height: 45px;
            font-size: 16px;
            margin: 20px 0 10px 0;
            border: 2px solid #707070;
            border-radius: 8px;
            background-color: #f0f0f0;
            cursor: pointer;
        }
        button:hover {
            background-color: #e0e0e0;
        }
        .error {
            color: red;
            font-size: 14px;
        }
        .success {
            color: green;
            font-size: 14px;
        }
        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #0066cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h1>Регистрация</h1>

<form id="registerForm">
    <input type="text" id="username" placeholder="Юзернейм" required>
    <input type="text" id="fio" placeholder="Фамилия Имя Отчество" required>
    <input type="text" id="job" placeholder="Должность" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Пароль" required>
    <input type="password" id="confirm_password" placeholder="Подтвердите пароль" required>
    <button type="submit">Зарегистрироваться</button>
    <div id="message"></div>
</form>

<a href="../login/index.html">Уже есть аккаунт? Войти</a>

<script>
    const apiUrl = 'http://localhost:8000';
    
    document.getElementById('registerForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        
        const username = document.getElementById('username').value;
        const fio = document.getElementById('fio').value;
        const job = document.getElementById('job').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirm_password = document.getElementById('confirm_password').value;
        const messageDiv = document.getElementById('message');
        
        if (password !== confirm_password) {
            messageDiv.innerHTML = '<p class="error">Пароли не совпадают</p>';
            return;
        }
        
        try {
            const response = await fetch(`${apiUrl}/api/users/register`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, fio, job, email, password })
            });
            
            const data = await response.json();
            
            if (response.ok && data.code === 200) {
                messageDiv.innerHTML = '<p class="success">Регистрация успешна! Проверьте почту для кода подтверждения</p>';
                setTimeout(() => {
                    window.location.href = '../verify/index.html';
                }, 2000);
            } else {
                messageDiv.innerHTML = `<p class="error">Ошибка: ${data.detail || 'Неизвестная ошибка'}</p>`;
            }
        } catch (error) {
            console.error('Ошибка:', error);
            messageDiv.innerHTML = '<p class="error">Ошибка сети</p>';
        }
    });
</script>

</body>
</html>
