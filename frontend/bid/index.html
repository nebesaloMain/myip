<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подача Заявления - IndPro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
            box-sizing: border-box;
            border: 2px solid #707070;
            border-radius: 8px;
        }
        input[type="text"], input[type="file"] {
            height: 45px;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        button {
            width: 100%;
            height: 45px;
            font-size: 16px;
            margin: 20px 0 10px 0;
            border: 2px solid #707070;
            border-radius: 8px;
            background-color: #f0f0f0;
            cursor: pointer;
        }
        button:hover {
            background-color: #e0e0e0;
        }
        .error {
            color: red;
            font-size: 14px;
        }
        .success {
            color: green;
            font-size: 14px;
        }
        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #0066cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h1>Подача Заявления</h1>

<form id="bidForm">
    <input type="text" id="name" placeholder="Заголовок заявления" required>
    <textarea id="content" placeholder="Основной текст заявления" required></textarea>
    <textarea id="add_content" placeholder="Дополнительный текст (опционально)"></textarea>
    <input type="file" id="files" multiple>
    <button type="submit">Подать заявление</button>
    <div id="message"></div>
</form>

<a href="../admin/index.html">Админ панель</a>
<a href="../login/index.html">Выход</a>

<script>
    const apiUrl = 'http://localhost:8000';
    
    document.getElementById('bidForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        
        const token = localStorage.getItem('token');
        if (!token) {
            alert('Сначала авторизуйтесь!');
            window.location.href = '../login/index.html';
            return;
        }
        
        const formData = new FormData();
        formData.append('name', document.getElementById('name').value);
        formData.append('content', document.getElementById('content').value);
        formData.append('add_content', document.getElementById('add_content').value);
        
        const files = document.getElementById('files').files;
        for (let file of files) {
            formData.append('files', file);
        }
        
        const messageDiv = document.getElementById('message');
        
        try {
            const response = await fetch(`${apiUrl}/api/bids/createnew`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`
                },
                body: formData
            });
            
            const data = await response.json();
            
            if (response.ok && data.code === 200) {
                messageDiv.innerHTML = '<p class="success">Заявление подано успешно!</p>';
                document.getElementById('bidForm').reset();
                setTimeout(() => {
                    window.location.reload();
                }, 2000);
            } else {
                messageDiv.innerHTML = `<p class="error">Ошибка: ${data.detail || 'Неизвестная ошибка'}</p>`;
            }
        } catch (error) {
            console.error('Ошибка:', error);
            messageDiv.innerHTML = '<p class="error">Ошибка сети</p>';
        }
    });
</script>

</body>
</html>
